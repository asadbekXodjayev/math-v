# MathGen data v1 build config. Implements research/RESEARCH_DESIGN.md §3 (tag prereg-v1).
# Changing anything here after the first build is a deviation: log it in research/decisions.md.
#
# Operand domains, per parameter, in the legacy generator's draw order:
#   [lo, hi]                    inclusive integer range
#   [[lo, hi], [lo, hi], ...]   union of inclusive ranges
#   ["a", "b", ...]             categorical choices
# ood_same / ood_longer overlay the id domains: `_default` applies to every parameter, and named
# parameters override it. Only the parameters listed are varied; the others keep their id domains.
# A template without an ood_* key has no such split.

version: 1

pools:              # sha256(instance key) bucket in [0, modulus)
  modulus: 1000
  train_below: 700  # train pool: bucket < 700
  val_below: 750    # val pool: 700 <= bucket < 750; test pool: bucket >= 750

gset_min_space: 500 # templates with a smaller id instance space form the M-set (no hash split)

split_sizes:        # items per template (per region for blocks)
  test_id_unseen: 200
  val: 50
  block: 200
  ood_same: 100
  ood_longer: 100

tokenizer_fit: {n: 50000, stream_seed: 0}

train:
  seeds: [0, 1, 2, 3, 4]
  n_max: 128000
  n_subsets: [2000, 8000, 32000, 128000]

blocks: [B1, B2, B3, B4, B5, B6, B7]   # predicates in src/mathgen/data/splits.py

templates:
  # ── F-int ──────────────────────────────────────────────────────────────────
  arith_pemdas:
    family: F-int
    id: {a: [2, 9], b: [2, 9], c: [2, 9]}
    ood_longer: {_default: [10, 30]}
  arith_integer:
    family: F-int
    id: {a: [2, 30], b: [2, 30], op: ["+", "-", "*"]}
    ood_same: {a: [31, 99], b: [31, 99]}
    ood_longer: {a: [100, 300], b: [100, 300]}
  algebra_linear:
    family: F-int
    id: {a: [2, 8], x: [1, 10], b: [0, 15]}
    ood_same: {x: [11, 99]}
    ood_longer: {x: [100, 300]}
  func_evaluate:
    family: F-int
    id: {a: [1, 5], b: [0, 8], c: [0, 10], x: [-4, 4]}
    ood_same: {x: [[-9, -5], [5, 9]]}
    ood_longer: {x: [[-30, -10], [10, 30]]}
  limit_substitution:
    family: F-int
    id: {a: [1, 4], b: [1, 6], c: [1, 9], x0: [1, 4]}
    ood_same: {x0: [5, 9]}
    ood_longer: {x0: [10, 30]}

  # ── F-frac ─────────────────────────────────────────────────────────────────
  arith_fractions:
    family: F-frac
    id: {n1: [1, 5], d1: [2, 8], n2: [1, 5], d2: [2, 8]}
    ood_same: {d1: [9, 9], d2: [9, 9]}
    ood_longer: {d1: [10, 30], d2: [10, 30]}
  vec_angle:
    family: F-frac
    id: {u0: [1, 5], u1: [1, 5], v0: [1, 5], v1: [1, 5]}
    ood_same: {_default: [6, 9]}
    ood_longer: {_default: [10, 30]}

  # ── F-mat ──────────────────────────────────────────────────────────────────
  vec_dot:
    family: F-mat
    id: {u0: [1, 12], u1: [1, 12], v0: [1, 12], v1: [1, 12]}
    ood_same: {_default: [13, 99]}
    ood_longer: {_default: [100, 300]}
  mat_add:
    family: F-mat
    id: {_default: [1, 9]}
    ood_longer: {_default: [10, 30]}
  mat_scalar:
    family: F-mat
    id: {_default: [1, 9], k: [2, 5]}
    ood_same: {k: [6, 9]}
    ood_longer: {k: [10, 30]}
  mat_mul:
    family: F-mat
    id: {_default: [1, 9]}
    ood_longer: {_default: [10, 30]}
  mat_det:
    family: F-mat
    id: {_default: [1, 9]}
    ood_longer: {_default: [10, 30]}
  mat_transpose:
    family: F-mat
    id: {_default: [1, 9]}
    ood_longer: {_default: [10, 30]}
  vec_magnitude:            # M-set
    family: F-mat
    id: {v0: [1, 12], v1: [1, 12]}
    ood_same: {_default: [13, 99]}
    ood_longer: {_default: [100, 300]}
  linear_transform:         # M-set
    family: F-mat
    id: {v0: [1, 12], v1: [1, 12]}
    ood_same: {_default: [13, 99]}
    ood_longer: {_default: [100, 300]}

  # ── F-calc ─────────────────────────────────────────────────────────────────
  deriv_polynomial:
    family: F-calc
    id: {a: [2, 5], n: [3, 5], b: [2, 6], m: [1, 2], c: [1, 9]}
    ood_same: {a: [6, 9]}
    ood_longer: {a: [10, 30]}
  deriv_power:              # M-set
    family: F-calc
    id: {a: [2, 6], n: [2, 5]}
    ood_same: {a: [7, 9]}
    ood_longer: {a: [10, 30]}
  deriv_at_point:           # M-set
    family: F-calc
    id: {a: [2, 5], b: [2, 6], x0: [1, 4]}
    ood_same: {x0: [5, 9]}
    ood_longer: {x0: [10, 30]}
  integral_power:           # M-set
    family: F-calc
    id: {n: [1, 4], coeff: [1, 3]}
    ood_same: {coeff: [4, 9]}
    ood_longer: {coeff: [10, 30]}
  integral_definite:        # M-set
    family: F-calc
    id: {n: [1, 3], coeff: [1, 3], b: [2, 4]}
    ood_same: {b: [5, 9]}
    ood_longer: {b: [10, 30]}
  limit_factor:             # M-set
    family: F-calc
    id: {c: [2, 6]}
    ood_same: {c: [7, 9]}
    ood_longer: {c: [10, 30]}
  limit_infinity:           # M-set
    family: F-calc
    id: {a: [2, 6], b: [2, 6], n: [2, 3]}
    ood_same: {a: [7, 9], b: [7, 9]}
    ood_longer: {a: [10, 30], b: [10, 30]}
  algebra_quadratic:        # M-set (grouped with F-calc by size, RESEARCH_DESIGN.md §3.1)
    family: F-calc
    id: {r1: [-6, 6], r2: [-6, 6]}
    ood_same: {_default: [[-9, -7], [7, 9]]}
    ood_longer: {_default: [[-30, -10], [10, 30]]}

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1111px" preserveAspectRatio="none" style="width:956px;height:1111px;background:#FDFDFD;" version="1.1" viewBox="0 0 956 1111" width="956px" zoomAndPan="magnify"><title>MathGen  -  Inner Training Loop (how ONE weight update happens)</title><defs/><g><rect fill="#FDFDFD" height="1111" style="stroke:none;stroke-width:1;" width="956" x="0" y="0"/><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="446.0791" x="253.6843" y="35.1074">MathGen  -  Inner Training Loop (how ONE weight update happens)</text><path d="M541.7485,49.6211 L541.7485,85.2031 L521.7485,89.2031 L541.7485,93.2031 L541.7485,128.7852 A0,0 0 0 0 541.7485,128.7852 L766.4448,128.7852 A0,0 0 0 0 766.4448,128.7852 L766.4448,59.6211 L756.4448,49.6211 L541.7485,49.6211 A0,0 0 0 0 541.7485,49.6211 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><path d="M756.4448,49.6211 L756.4448,59.6211 L766.4448,59.6211 L756.4448,49.6211 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="196.3838" x="547.7485" y="68.6494">A "batch" = 32 example problems.</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="171.2153" x="547.7485" y="85.9404">The model tries to guess each</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="203.6963" x="547.7485" y="103.2314">next token; we measure how wrong</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="165.2358" x="547.7485" y="120.5225">it is, then nudge the weights.</text><ellipse cx="511.7485" cy="89.2031" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="266.9316" x="378.2827" y="148.7852"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="229.9805" x="388.2827" y="171.7344">Get a batch (32 examples) from DataLoader</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="246.9316" x="388.2827" y="187.6953">(x = the text so far,  y = the correct next token)</text><rect fill="#F4ECF7" height="371.4629" style="stroke:#000000;stroke-width:1.5;" width="657.3364" x="11" y="210.707"/><path d="M350.2803,210.707 L350.2803,240.9492 L340.2803,250.9492 L11,250.9492 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="229.1133" x="14" y="226.8145">fp16 AMP wraps forward + backward</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="329.2803" x="14" y="245.4355">(autocast saves VRAM, GradScaler keeps math stable)</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="220.7422" x="401.3774" y="267.9492"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180.4746" x="411.3774" y="290.8984">Forward pass:  model(x)  -&gt;  logits</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="200.7422" x="411.3774" y="306.8594">(the model's guess for the next token)</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="225.2305" x="399.1333" y="339.8711"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="155.9297" x="409.1333" y="362.8203">Compute cross-entropy LOSS</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="205.2305" x="409.1333" y="378.7813">(compare logits vs target next-token y)</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="264.5234" x="379.4868" y="411.793"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="146.9824" x="389.4868" y="434.7422">loss = loss / grad_accum (2)</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="244.5234" x="389.4868" y="450.7031">(we sum 2 micro-batches, so scale each down)</text><path d="M21,473.7148 L21,570.1699 A0,0 0 0 0 21,570.1699 L345.1606,570.1699 A0,0 0 0 0 345.1606,570.1699 L345.1606,525.9424 L365.1606,521.9424 L345.1606,517.9424 L345.1606,483.7148 L335.1606,473.7148 L21,473.7148 A0,0 0 0 0 21,473.7148 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><path d="M335.1606,473.7148 L335.1606,483.7148 L345.1606,483.7148 L335.1606,473.7148 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="137.9663" x="27" y="492.7432">WHAT JUST HAPPENED:</text><ellipse cx="32.5" cy="505.7969" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="291.1606" x="39" y="510.0342">LOSS  = HOW WRONG the model is (one number).</text><ellipse cx="32.5" cy="523.0879" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="289.4468" x="39" y="527.3252">BACKPROP = WHICH DIRECTION to adjust each of</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="241.9346" x="34.1221" y="544.6162">the ~35M weights (a gradient per weight).</text><ellipse cx="32.5" cy="557.6699" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="242.1821" x="39" y="561.9072">The OPTIMIZER then takes the actual step.</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="293.1758" x="365.1606" y="495.9814"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="242.6602" x="375.1606" y="518.9307">Backward pass:  loss.backward()  -&gt;  gradients</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="273.1758" x="375.1606" y="534.8916">(for every weight: which direction reduces the loss?)</text><rect fill="#EAF2F8" height="35.9609" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="237.5117" x="392.9927" y="651.4854"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="217.5117" x="402.9927" y="674.4346">(gradients add up, no weight change yet)</text><polygon fill="#FCF3CF" points="436.9023,602.1699,586.5947,602.1699,598.5947,614.1699,586.5947,626.1699,436.9023,626.1699,424.9023,614.1699,436.9023,602.1699" style="stroke:#2C3E50;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="172.3262" x="515.7485" y="638.04">not yet  -  keep collecting gradients</text><text fill="#000000" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="149.6924" x="436.9023" y="618.7246">Accumulated 2 micro-batches?</text><text fill="#000000" font-family="Segoe UI" font-size="11" lengthAdjust="spacing" textLength="15.7427" x="598.5947" y="611.4092">yes</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="277.2617" x="373.1177" y="729.4463"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="163.1895" x="383.1177" y="752.3955">Clip gradients to max norm 1.0</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="257.2617" x="383.1177" y="768.3564">(stops one giant update from blowing things up)</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="261.8164" x="380.8403" y="801.3682"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="241.8164" x="390.8403" y="824.3174">Optimizer step:  AdamW updates ALL weights</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="164.1035" x="390.8403" y="840.2783">(takes the actual step downhill)</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="272.0938" x="375.7017" y="873.29"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="252.0938" x="385.7017" y="896.2393">Cosine-warmup scheduler sets the learning rate</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="192.6621" x="385.7017" y="912.2002">(small at first, then smoothly decays)</text><path d="M642.5386,940.2363 L642.5386,967.1729 L622.5386,971.1729 L642.5386,975.1729 L642.5386,1002.1094 A0,0 0 0 0 642.5386,1002.1094 L944.4478,1002.1094 A0,0 0 0 0 944.4478,1002.1094 L944.4478,950.2363 L934.4478,940.2363 L642.5386,940.2363 A0,0 0 0 0 642.5386,940.2363 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><path d="M934.4478,940.2363 L934.4478,950.2363 L944.4478,950.2363 L934.4478,940.2363 " fill="#FEF9E7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="280.9092" x="648.5386" y="959.2646">One full pass through here = ONE optimizer step</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="207.6572" x="648.5386" y="976.5557">(= 1 effective batch of 64 examples).</text><text fill="#000000" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="205.9878" x="648.5386" y="993.8467">Then we loop back to "Get a batch".</text><rect fill="#EAF2F8" height="51.9219" rx="12.5" ry="12.5" style="stroke:#2C3E50;stroke-width:0.5;" width="221.5801" x="400.9585" y="945.2119"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="97.5703" x="410.9585" y="968.1611">Zero the gradients</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="201.5801" x="410.9585" y="984.1221">(wipe the slate clean for the next step)</text><polygon fill="#EAF2F8" points="431.811,1022.1094,591.686,1022.1094,601.686,1040.0898,591.686,1058.0703,431.811,1058.0703" style="stroke:#2C3E50;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="139.875" x="441.811" y="1045.0586">loop back to "Get a batch"</text><ellipse cx="511.7485" cy="1089.0703" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="511.7485" cy="1089.0703" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="99.2031" y2="148.7852"/><polygon fill="#181818" points="507.7485,138.7852,511.7485,148.7852,515.7485,138.7852,511.7485,142.7852" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="319.8711" y2="339.8711"/><polygon fill="#181818" points="507.7485,329.8711,511.7485,339.8711,515.7485,329.8711,511.7485,333.8711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="391.793" y2="411.793"/><polygon fill="#181818" points="507.7485,401.793,511.7485,411.793,515.7485,401.793,511.7485,405.793" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="463.7148" y2="495.9814"/><polygon fill="#181818" points="507.7485,485.9814,511.7485,495.9814,515.7485,485.9814,511.7485,489.9814" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="200.707" y2="267.9492"/><polygon fill="#181818" points="507.7485,257.9492,511.7485,267.9492,515.7485,257.9492,511.7485,261.9492" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="626.1699" y2="651.4854"/><polygon fill="#181818" points="507.7485,641.4854,511.7485,651.4854,515.7485,641.4854,511.7485,645.4854" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="598.5947" x2="640.5044" y1="614.1699" y2="614.1699"/><polygon fill="#181818" points="636.5044,656.4658,640.5044,666.4658,644.5044,656.4658,640.5044,660.4658" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="640.5044" x2="640.5044" y1="614.1699" y2="709.4463"/><line style="stroke:#181818;stroke-width:1;" x1="640.5044" x2="511.7485" y1="709.4463" y2="709.4463"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="709.4463" y2="729.4463"/><polygon fill="#181818" points="507.7485,719.4463,511.7485,729.4463,515.7485,719.4463,511.7485,723.4463" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="547.9033" y2="602.1699"/><polygon fill="#181818" points="507.7485,592.1699,511.7485,602.1699,515.7485,592.1699,511.7485,596.1699" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="781.3682" y2="801.3682"/><polygon fill="#181818" points="507.7485,791.3682,511.7485,801.3682,515.7485,791.3682,511.7485,795.3682" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="853.29" y2="873.29"/><polygon fill="#181818" points="507.7485,863.29,511.7485,873.29,515.7485,863.29,511.7485,867.29" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="925.2119" y2="945.2119"/><polygon fill="#181818" points="507.7485,935.2119,511.7485,945.2119,515.7485,935.2119,511.7485,939.2119" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="997.1338" y2="1022.1094"/><polygon fill="#181818" points="507.7485,1012.1094,511.7485,1022.1094,515.7485,1012.1094,511.7485,1016.1094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="511.7485" x2="511.7485" y1="1058.0703" y2="1078.0703"/><polygon fill="#181818" points="507.7485,1068.0703,511.7485,1078.0703,515.7485,1068.0703,511.7485,1072.0703" style="stroke:#181818;stroke-width:1;"/><!--SRC=[TLLjJ-D64FwUNp5AFzIv0ZtWNjgSk9Cn2QG54a6kIATArM2FxIthNMjtdPTMxM_lZED0kAEAb3ZspBCpp_FCEAYW2QumbETa0FO19iQGWxb3PPGfuDBQ6gBIBc5wFO8bgQ8CqDGP1e8IwvgC7_Hw_a6P6XrMS8_fG-5iOxB4QklWk_6PV7OYuZIeXGhhK-ioSbtKKN8yUllwfQYlyKRn-6ZyqmkHPmehQx9l4iR9-3WPxoGO6-ZRgD7uvz7xdQYCScnq65iJhh4YwDzIOGa-J_hSRa0NUZq10YUCz01YwDzZICi-dC3n4T0AgvgfhPszrrJv0mwPbmILpKX3S8ey10j5Gzu3OLhoSqEhm3SVo7nWfg4Yz8rZcfdyfREcu10LGFaz22MhPPgi8BdiPE4po6HjUxtUy9m28BGbGVHKa1z0xcm5PnZmqY8hyBk9Lbopu0Gfm5l8qUq1hBkxgNMEqh1Jtk13hySi1HMKDT3FwyDt45_Dk4giFUJMBT5by4Dh1hda8x09DaNFyBZWrd-xYQ_suDnXTfkYPiCz475gnKO4PfSf6_HPb3UZPFmU_kR6X-CEjKRlXx3XCLeDsBCV0RGjLF1yJDXI_BtlkELgsYwULSzuYQtgXlLBdVL-dqnmjbx3vVJsbc5IVeXC_GON5gmLke8s7EotAB3Uu6XEPwBQdn-Xu8x-m3HjAeYE1ep4Edh-SmILufFsMps85MIMlNJUQW-PNNPbdNQKRViKt8CjZr7NhfoYk6JfMFgZ1Rbrvu8XB4iba4f44tqSPKqgTYkfXVl49_tJkLTJBkQzkuZdyCldspbSnBFPw7fqDkIxhrewWBkxcDx1tStq-XmU2MOVGcGD4zjKz-G61st2QPpyEhkPpZZdxcAINC3Pv6QKp2VJQt4xPdysR86sPPjp0hHu_nw_lTfw629yR0zgDiRcVWSl4pITpITNao-ZcyqK17peUiCqDAZPFbJlJeBA8Of5aKRpqig-bkBJO8CJ6JleRUZbF5YpsB8EnPSy0LeBcRmF7wblrOeU_t9l6U_5FKxURicqHCC3oaYjj1a56NFIdY1Qyo1AZIhdKKsqgf-0XQWALmpaAZWyUCqQ-s1vE8JiGg5vtB_j8DzhkvJ2GidVdX_nOSDf7LIb_cBwX0ssKPnXTTVbUOWlBxTyoyoyn61hoL9fBN29zShGFbkmQchsRScEag7r53fR4RhsTU4ONmgkK6l00BboF